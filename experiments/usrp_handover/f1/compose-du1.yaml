# F1 USRP (distributed) — DU1 host. Drives one USRP X310 (cell 1).
# Connects to the CU (CU_HOST_IP) over F1.
#   docker compose -f compose-du1.yaml --env-file .env up -d
services:
    du1:
        image: oaisoftwarealliance/oai-gnb:develop
        container_name: oai-du1
        network_mode: host
        cap_add:
            - SYS_NICE
        ulimits:
            memlock: -1
            rtprio: 99
        environment:
            USE_ADDITIONAL_OPTIONS: --log_config.global_log_options level,nocolor,time
                                    --MACRLCs.[0].local_n_address ${DU1_HOST_IP}
                                    --MACRLCs.[0].remote_n_address ${CU_HOST_IP}
                                    --RUs.[0].sdr_addrs addr=${DU1_SDR_ADDR}
                                    --continuous-tx
            ASAN_OPTIONS: detect_leaks=0:detect_odr_violation=0
        volumes:
            - ./conf-du1.conf:/opt/oai-gnb/etc/gnb.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 10s
            timeout: 5s
            retries: 5
