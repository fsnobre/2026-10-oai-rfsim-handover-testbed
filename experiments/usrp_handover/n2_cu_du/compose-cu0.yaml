# N2 CU/DU USRP (distributed) — cu0 host (site 0, radio-less). Handover source.
#   docker compose -f compose-cu0.yaml --env-file .env up -d
services:
    cu0:
        image: oaisoftwarealliance/oai-gnb:develop
        container_name: oai-cu0
        network_mode: host
        cap_add:
            - SYS_NICE
        environment:
            USE_ADDITIONAL_OPTIONS: --log_config.global_log_options level,nocolor,time
                                    --gNBs.[0].local_s_address ${CU0_HOST_IP}
                                    --gNBs.[0].remote_s_address 0.0.0.0
                                    --gNBs.[0].amf_ip_address.[0].ipv4 ${AMF_N2_IP}
                                    --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF ${CU0_HOST_IP}
                                    --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU ${CU0_HOST_IP}
                                    --telnetsrv --telnetsrv.listenaddr ${CU0_HOST_IP} --telnetsrv.shrmod ci
            ASAN_OPTIONS: detect_leaks=0:detect_odr_violation=0
        volumes:
            - ./conf-cu0.conf:/opt/oai-gnb/etc/gnb.conf
            - ./neighbour-config.conf:/opt/oai-gnb/etc/neighbour-config.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 10s
            timeout: 5s
            retries: 5
