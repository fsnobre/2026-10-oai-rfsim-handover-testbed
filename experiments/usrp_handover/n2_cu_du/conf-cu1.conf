# N2 handover (USRP, distributed) — cu1 (site 1, radio-less). Handover target.
# F1 + AMF/NG addresses are injected by the compose from .env (CU1_HOST_IP,
# CORE_HOST_IP). See docs/guide-usrp-distributed-handover.md.
Active_gNBs = ( "cu1-usrp");
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xe01;

    gNB_name  =  "cu1-usrp";

    tracking_area_code  =  1;
    plmn_list = ({ mcc = 001;
                    mnc = 01;
                    mnc_length = 2;
                    snssaiList = ({ sst = 1 } ) });

    @include "neighbour-config.conf"

    nr_cellid = 11111111L;

    tr_s_preference = "f1";

    # F1: overridden per deployment (--gNBs.[0].local_s_address ${CU1_HOST_IP},
    # --gNBs.[0].remote_s_address 0.0.0.0).
    local_s_address = "127.0.0.1";
    remote_s_address = "0.0.0.0";
    local_s_portc   = 501;
    local_s_portd   = 2153;
    remote_s_portc  = 500;
    remote_s_portd  = 2153;

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    ////////// AMF parameters (overridden to the core host LAN IP at runtime):
    amf_ip_address = ({ ipv4 = "127.0.0.1"; });

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "127.0.0.1";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "127.0.0.1";
        GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
    };
  }
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config : {
  global_log_level = "info";
  pdcp_log_level = "info";
  rrc_log_level = "info";
  f1ap_log_level = "info";
  ngap_log_level = "debug";
};
