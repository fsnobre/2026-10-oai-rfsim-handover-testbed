# N2 handover (USRP, distributed) — gnb0, cell 0 (PCI 0). Monolithic, one X310.
# AMF/NG addresses are injected by the compose from .env (CORE_HOST_IP,
# GNB0_HOST_IP). See docs/en/guide-usrp-distributed-handover.md.
Active_gNBs = ( "gnb0");
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xe00;

    gNB_name  =  "gnb0";

    tracking_area_code  =  1;
    plmn_list = ({ mcc = 001;
                    mnc = 01;
                    mnc_length = 2;
                    snssaiList = ({ sst = 1 } ) });

    @include "neighbour-config.conf"

    nr_cellid = 12345678L;

    ////////// Physical parameters:
    min_rxtxtime                                              = 6;

    servingCellConfigCommon = (
    {
      physCellId                                                    = 0;

      absoluteFrequencySSB                                          = 641280;
      dl_frequencyBand                                                 = 78;
      dl_absoluteFrequencyPointA                                       = 640008;
        dl_offstToCarrier                                              = 0;
        dl_subcarrierSpacing                                           = 1;
        dl_carrierBandwidth                                            = 106;
        initialDLBWPlocationAndBandwidth                               = 28875;
        initialDLBWPsubcarrierSpacing                                           = 1;
        initialDLBWPcontrolResourceSetZero                              = 12;
        initialDLBWPsearchSpaceZero                                             = 0;

      ul_frequencyBand                                                 = 78;
      ul_offstToCarrier                                              = 0;
      ul_subcarrierSpacing                                           = 1;
      ul_carrierBandwidth                                            = 106;
      pMax                                                          = 20;
        initialULBWPlocationAndBandwidth                            = 28875;
        initialULBWPsubcarrierSpacing                                           = 1;
          prach_ConfigurationIndex                                  = 98;
          prach_msg1_FDM                                            = 0;
          prach_msg1_FrequencyStart                                 = 0;
          zeroCorrelationZoneConfig                                 = 13;
          preambleReceivedTargetPower                               = -96;
          preambleTransMax                                          = 6;
        powerRampingStep                                            = 1;
        ra_ResponseWindow                                           = 5;
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 4;
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 14;
        ra_ContentionResolutionTimer                                = 7;
        rsrp_ThresholdSSB                                           = 19;
        prach_RootSequenceIndex_PR                                  = 2;
        prach_RootSequenceIndex                                     = 1;
        msg1_SubcarrierSpacing                                      = 1,
        restrictedSetConfig                                         = 0,
        msg3_DeltaPreamble                                          = 1;
        p0_NominalWithGrant                                         =-90;
        pucchGroupHopping                                           = 0;
        hoppingId                                                   = 40;
        p0_nominal                                                  = -90;
      ssb_PositionsInBurst_Bitmap                                   = 1;
      ssb_periodicityServingCell                                    = 2;
      dmrs_TypeA_Position                                           = 0;
      subcarrierSpacing                                             = 1;
      referenceSubcarrierSpacing                                    = 1;
      dl_UL_TransmissionPeriodicity                                 = 6;
      nrofDownlinkSlots                                             = 7;
      nrofDownlinkSymbols                                           = 6;
      nrofUplinkSlots                                               = 2;
      nrofUplinkSymbols                                             = 4;
      ssPBCH_BlockPower                                             = -25;
     }
  );

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    ////////// AMF parameters (overridden to the core host LAN IP at runtime):
    amf_ip_address = ( { ipv4 = "127.0.0.1"; } );

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "127.0.0.1";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "127.0.0.1";
        GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
    };
  }
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

MACRLCs = (
  {
    num_cc           = 1;
    tr_s_preference  = "local_L1";
    tr_n_preference  = "local_RRC";
    pusch_TargetSNRx10          = 200;
    pucch_TargetSNRx10          = 200;
  }
);

L1s = (
{
  num_cc = 1;
  tr_n_preference = "local_mac";
  prach_dtx_threshold = 200;
  pucch0_dtx_threshold = 150;
  ofdm_offset_divisor = 8;
}
);

# Real radio: USRP X310 over 10GbE. No rfsimulator / channelmod blocks.
RUs = (
    {
       local_rf       = "yes"
         nb_tx          = 1
         nb_rx          = 1
         att_tx         = 0
         att_rx         = 0;
         bands          = [78];
         max_pdschReferenceSignalPower = -27;
         max_rxgain                    = 114;
         eNB_instances  = [0];
         sdr_addrs      = "addr=192.168.40.2";   # this gNB's X310 (on its own host)
         clock_src      = "internal";
         time_src       = "internal";
    }
);

log_config: {
  global_log_level = "info";
  hw_log_level     = "info";
  ngap_log_level   = "debug";
};
